name: Release

permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: false

      - name: Build the project
        run: pnpm build

      - name: Bump version
        run: |
          VERSION=$(pnpm version ${{ inputs.release_type }} --no-git-tag-version)
          echo "New version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/${{ env.VERSION }}
          title: "chore(release): bump version to ${{ env.VERSION }}"
          body: "Automated version bump (${{ inputs.release_type }})"
          commit-message: "chore(release): bump version (${{ inputs.release_type }})"
          base: main
          delete-branch: true

      - name: Merge Pull Request
        if: steps.pr.outputs.pull-request-number
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --merge --admin
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create Git tag
        run: |
          git tag -a "$VERSION" -m "Release ${{ env.VERSION }}"
          git push origin "$VERSION"

      - name: Publish to npm
        run: npm publish --provenance
